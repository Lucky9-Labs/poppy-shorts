name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Determine release intent
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          files=(.changeset/*.md)
          if [[ ! -e "${files[0]}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bump=patch
          for file in "${files[@]}"; do
            grep -q '"poppy-shorts": major' "$file" && bump=major
            if [[ "$bump" != major ]] && grep -q '"poppy-shorts": minor' "$file"; then bump=minor; fi
          done
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Version and tag release
        if: steps.intent.outputs.skip != 'true'
        env:
          BUMP: ${{ steps.intent.outputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node scripts/release-version.mjs "$BUMP")
          node scripts/check-version-consistency.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json plugin.json .codex-plugin/plugin.json
          git commit -m "chore: release v$version"
          git tag "v$version"
          git push origin main "v$version"
          gh release create "v$version" --generate-notes --title "v$version"
          rm -f .changeset/*.md
          git add .changeset
          git commit -m "chore: consume release intent" || true
          git push origin main
